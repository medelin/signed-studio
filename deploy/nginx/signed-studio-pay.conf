# nginx server block for Signed Studio (PayPal edition) on a fresh small VM.
# /etc/nginx/sites-available/signed-studio-pay, linked into sites-enabled. Replace
# pay.example.org; certbot --nginx adds the certificate lines. `nginx -t` before reload.
server {
    listen 80;
    listen [::]:80;
    server_name pay.example.org;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pay.example.org;
    ssl_certificate     /etc/letsencrypt/live/pay.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.example.org/privkey.pem;

    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # upload paths (studio.app.UPLOAD_LIMITS): voice 32 MB, clips 64 MB; the app enforces
    # each path's own limit again
    location ~ ^/api/(v1/)?briefs/voice$ {
        client_max_body_size 32m;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location = /api/clips {
        client_max_body_size 64m;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        # the PayPal webhook body must reach the app unchanged (its signature covers it)
        proxy_request_buffering on;
    }
}
