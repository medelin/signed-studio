# Apache 2.4 virtual host for Signed Studio (PayPal edition) on a shared host.
# Needs: mod_proxy, mod_proxy_http, mod_headers, mod_rewrite, mod_ssl (a2enmod proxy
# proxy_http headers rewrite ssl). Replace pay.example.org; get the certificate with
# certbot (--apache or --webroot).
# The app listens on 127.0.0.1:8100 only (deploy/muse-pay.service); this file is the only
# change to Apache. Check with `apachectl configtest` before `systemctl reload apache2`.

<VirtualHost *:80>
    ServerName pay.example.org
    # ACME http-01 challenges stay on port 80; everything else goes to https
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName pay.example.org
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/pay.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pay.example.org/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 120
    # /webhooks/paypal needs the raw body byte for byte: Apache passes it unchanged
    ProxyPass        / http://127.0.0.1:8100/ retry=0 timeout=120
    ProxyPassReverse / http://127.0.0.1:8100/
    RequestHeader set X-Forwarded-Proto "https"
    # X-Forwarded-For is added by mod_proxy; the app trusts it only from TRUSTED_PROXY

    Header always set Strict-Transport-Security "max-age=31536000"
    # Debian's conf-enabled/security.conf may "Header set Content-Security-Policy" for every
    # site, replacing the app's policy. vhost Header directives run after the global ones:
    # restore the app's policy from its X-Studio-CSP copy, then drop the copy. (If the global
    # one is "Header always set", make these "Header always" too.) Check with
    # curl -sI https://pay.example.org/login | grep -ci content-security  # must be 1
    Header set Content-Security-Policy "expr=%{resp:X-Studio-CSP}" "expr=-n %{resp:X-Studio-CSP}"
    Header unset X-Studio-CSP
    LimitRequestBody 26214400
    # The app's upload paths (studio.app.UPLOAD_LIMITS: voice 32 MB, clips 64 MB, reports
    # 6 MB) get room up to the largest; the app enforces each path's own limit and answers
    # with its JSON error. ModSecurity (often 1 MB for bodies without files) is raised for
    # these paths only.
    <LocationMatch "^/api/(v1/)?briefs/voice$|^/api/(reports|clips)$">
        LimitRequestBody 67108864
        <IfModule security2_module>
            SecRequestBodyLimit 67108864
            SecRequestBodyNoFilesLimit 67108864
        </IfModule>
    </LocationMatch>
</VirtualHost>
