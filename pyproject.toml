[project]
name = "muse-studio-lite"
version = "0.1.0"
description = "AI ad agency for one-person businesses: Meta Muse agents plan, write, draw and review; a human signs every send; every step leaves a verifiable receipt."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Piotr Kaczmarski" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "cryptography>=42",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pyyaml==6.0.3",
  "pillow==13.0.0",
  "meta-sam-parser==0.1.0",
  "argon2-cffi==25.1.0",
  "segno==1.6.6",
  "mcp==1.30.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6", "mypy>=1.11", "types-PyYAML==6.0.12.20260906"]

[project.scripts]
studio = "studio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.setuptools.package-data]
studio = ["ui/templates/*.html", "ui/static/*", "agents/prompts/*.md", "agents/*.yaml", "paypal/intermediates.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: talks to the PayPal sandbox; needs RUN_PAYPAL_LIVE_TESTS=1 and the credentials file"]
# the vendored PayPal toolkit (kept byte for byte, see its NOTICE.md) still calls
# datetime.utcnow() and pydantic's .dict()
filterwarnings = [
    "ignore:datetime.datetime.utcnow:DeprecationWarning:studio.vendor.paypal_agent_toolkit",
    "ignore:The `dict` method is deprecated:DeprecationWarning:studio.vendor.paypal_agent_toolkit",
]

[tool.ruff]
line-length = 100
# vendored third-party code (see its NOTICE.md) is kept byte for byte
extend-exclude = ["studio/vendor"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "studio.vendor.*"
ignore_errors = true

[tool.ruff.lint.per-file-ignores]
# Synthetic test credentials are not secrets.
"tests/**" = ["S105", "S106", "S107"]
